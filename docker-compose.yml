version: "3.8"

# ==============================================================================
# ILCMS Local Laptop Architecture: Only AI Subsystem is 100% Air-Gapped
# ==============================================================================
# The AI Inference engine (Ollama) is isolated on an internal bridge network
# with `internal: true` ensuring ZERO egress to external internet/cloud endpoints.
# Confidential Icelandic court briefs, filings, and client data never leave the host.
# ==============================================================================

services:
  # 1. Ollama AI Inference Service (100% Air-Gapped with ZERO OUTBOUND EGRESS)
  ollama:
    image: ollama/ollama:0.5.7
    container_name: ilcms-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434" # Bound strictly to local loopback
    networks:
      - ilcms_ai_isolated_net
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_MODELS=/root/.ollama/models
      - OLLAMA_ORIGINS=*
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=24h
    deploy:
      resources:
        limits:
          cpus: '6.0'
          memory: 10G
        reservations:
          cpus: '2.0'
          memory: 4G

  # 2. PostgreSQL with pgvector extension enabled
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ilcms-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - ilcms_net
    environment:
      - POSTGRES_DB=ilcms_db
      - POSTGRES_USER=ilcms_user
      - POSTGRES_PASSWORD=ilcms_secret_password
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/00-init-keycloak.sql:/docker-entrypoint-initdb.d/00-init-keycloak.sql:ro
      - ./sql/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 3G
        reservations:
          cpus: '0.5'
          memory: 1G

  # 3. Keycloak 24 OIDC Authentication Server
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: ilcms-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - ilcms_net
    depends_on:
      - postgres
    environment:
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres:5432/keycloak_db
      - KC_DB_USERNAME=ilcms_user
      - KC_DB_PASSWORD=ilcms_secret_password
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin_secret_ilcms
      - KC_HEALTH_ENABLED=true
      - KC_HTTP_ENABLED=true
      - KC_HOSTNAME_STRICT=false
      - JAVA_OPTS_KC_HEAP=-Xms256m -Xmx768m -XX:MetaspaceSize=96M -XX:MaxMetaspaceSize=256m
    volumes:
      - ./deploy/keycloak/ilcms-realm.json:/opt/keycloak/data/import/ilcms-realm.json:ro
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M

  # 4. ILCMS Web Application (Frontend + API Routes)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ilcms-web:latest
    container_name: ilcms-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - ilcms_net
      - ilcms_ai_isolated_net
    depends_on:
      - postgres
      - ollama
      - keycloak
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - AIRGAP_MODE=true
      - AIRGAP_AI_ONLY=true
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=gemma2:9b
      - OLLAMA_EMBED_MODEL=nomic-embed-text
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=ilcms
      - KEYCLOAK_CLIENT_ID=ilcms-web
      - DATABASE_URL=postgresql://ilcms_user:ilcms_secret_password@postgres:5432/ilcms_db
      - OPEN_WEBUI_URL=http://localhost:3080
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # 5. Open WebUI (100% Air-Gapped Browser Interface for Ollama)
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: ilcms-open-webui
    restart: unless-stopped
    ports:
      - "127.0.0.1:3080:8080"
    networks:
      - ilcms_net
      - ilcms_ai_isolated_net
    depends_on:
      - ollama
    environment:
      - PORT=8080
      - WEBUI_PORT=8080
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_NAME=ILCMS Legal AI (Open WebUI)
      - WEBUI_AUTH=false
      - DATA_DIR=/app/backend/data
      - DEFAULT_MODELS=gemma2:9b
      - ENV=prod
      - OFFLINE_MODE=true
      - HF_HUB_OFFLINE=1
      - RAG_EMBEDDING_MODEL_AUTO_UPDATE=false
      - RAG_RERANKING_MODEL_AUTO_UPDATE=false
      - RAG_EMBEDDING_ENGINE=ollama
      - RAG_OLLAMA_BASE_URL=http://ollama:11434
      - RAG_EMBEDDING_MODEL=nomic-embed-text
      - ENABLE_COMMUNITY_SHARING=false
    volumes:
      - open_webui_data:/app/backend/data
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

networks:
  ilcms_net:
    driver: bridge
  # 100% Air-Gapped Network: internal=true prevents all outbound internet/WAN egress
  ilcms_ai_isolated_net:
    driver: bridge
    internal: true

volumes:
  ollama_data:
    driver: local
  postgres_data:
    driver: local
  open_webui_data:
    driver: local
