apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-webui-pvc
  namespace: ilcms
  labels:
    app: open-webui
    app.kubernetes.io/component: ai-webui
    app.kubernetes.io/part-of: ilcms
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: ilcms
  labels:
    app: open-webui
    app.kubernetes.io/component: ai-webui
    app.kubernetes.io/part-of: ilcms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
        app.kubernetes.io/component: ai-webui
        app.kubernetes.io/part-of: ilcms
    spec:
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:main
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            - name: WEBUI_PORT
              value: "8080"
            - name: OLLAMA_BASE_URL
              value: "http://ollama.ilcms.svc.cluster.local:11434"
            - name: WEBUI_NAME
              value: "ILCMS Legal AI (Open WebUI)"
            - name: WEBUI_AUTH
              value: "false"
            - name: DATA_DIR
              value: "/app/backend/data"
            - name: DEFAULT_MODELS
              value: "gemma2:9b"
            - name: ENV
              value: "prod"
            # 100% Air-Gapped / Offline Flags (Prevents HuggingFace & update network timeouts)
            - name: OFFLINE_MODE
              value: "true"
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: RAG_EMBEDDING_MODEL_AUTO_UPDATE
              value: "false"
            - name: RAG_RERANKING_MODEL_AUTO_UPDATE
              value: "false"
            - name: RAG_EMBEDDING_ENGINE
              value: "ollama"
            - name: RAG_OLLAMA_BASE_URL
              value: "http://ollama.ilcms.svc.cluster.local:11434"
            - name: RAG_EMBEDDING_MODEL
              value: "nomic-embed-text"
            - name: ENABLE_COMMUNITY_SHARING
              value: "false"
            - name: WEBUI_URL
              value: "http://chat.ilcms.local"
          resources:
            requests:
              cpu: "50m"
              memory: "256Mi"
            limits:
              cpu: "1500m"
              memory: "1536Mi"
          volumeMounts:
            - name: open-webui-storage
              mountPath: /app/backend/data
          # Startup probe allows Open WebUI up to 165 seconds to run initial database migrations
          # and initialize local Chroma vector store before liveness / readiness probes start.
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
      volumes:
        - name: open-webui-storage
          persistentVolumeClaim:
            claimName: open-webui-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: ilcms
  labels:
    app: open-webui
    app.kubernetes.io/component: ai-webui
    app.kubernetes.io/part-of: ilcms
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: open-webui
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: open-webui-ingress
  namespace: ilcms
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: chat.ilcms.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: open-webui
                port:
                  number: 8080
    - host: ai.ilcms.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: open-webui
                port:
                  number: 8080
