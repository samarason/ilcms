apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-sql
  namespace: ilcms
data:
  00-init-keycloak-db.sql: |
    SELECT 'CREATE DATABASE keycloak_db'
    WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'keycloak_db')\gexec
    GRANT ALL PRIVILEGES ON DATABASE keycloak_db TO ilcms_user;

  01-init-pgvector.sql: |
    CREATE EXTENSION IF NOT EXISTS vector;
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";

    CREATE TABLE IF NOT EXISTS cases (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        case_number VARCHAR(50) UNIQUE NOT NULL,
        title VARCHAR(255) NOT NULL,
        description TEXT,
        priority VARCHAR(20) DEFAULT 'NORMAL',
        status VARCHAR(20) DEFAULT 'OPEN',
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    CREATE TABLE IF NOT EXISTS documents (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        case_id UUID REFERENCES cases(id) ON DELETE CASCADE,
        title VARCHAR(255) NOT NULL,
        file_path TEXT,
        doc_type VARCHAR(50) DEFAULT 'Málsskjal',
        status VARCHAR(50) DEFAULT 'READY',
        page_count INTEGER DEFAULT 1,
        checksum VARCHAR(64),
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    CREATE TABLE IF NOT EXISTS document_chunks (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        document_id UUID REFERENCES documents(id) ON DELETE CASCADE,
        case_id UUID REFERENCES cases(id) ON DELETE CASCADE,
        chunk_index INTEGER NOT NULL,
        chunk_text TEXT NOT NULL,
        page_number INTEGER,
        embedding vector(768),
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    CREATE INDEX IF NOT EXISTS idx_document_chunks_embedding_hnsw 
    ON document_chunks USING hnsw (embedding vector_cosine_ops);

    CREATE INDEX IF NOT EXISTS idx_document_chunks_case_id 
    ON document_chunks(case_id);

    CREATE OR REPLACE FUNCTION search_case_chunks(
        p_case_id UUID,
        p_query_embedding vector(768),
        p_match_count INT DEFAULT 5
    )
    RETURNS TABLE (
        chunk_id UUID,
        document_id UUID,
        document_title VARCHAR,
        chunk_text TEXT,
        page_number INT,
        similarity FLOAT
    )
    LANGUAGE plpgsql
    AS $$
    BEGIN
        RETURN QUERY
        SELECT
            dc.id AS chunk_id,
            dc.document_id,
            d.title AS document_title,
            dc.chunk_text,
            dc.page_number,
            1 - (dc.embedding <=> p_query_embedding) AS similarity
        FROM document_chunks dc
        JOIN documents d ON d.id = dc.document_id
        WHERE dc.case_id = p_case_id
        ORDER BY dc.embedding <=> p_query_embedding
        LIMIT p_match_count;
    END;
    $$;

    INSERT INTO cases (id, case_number, title, description, priority, status)
    VALUES 
        ('11111111-1111-1111-1111-111111111111', 'M-4821/2026', 'Málflutningur vegna fasteignagalla', 'Ágreiningur um leynda galla við sölu á einbýlishúsi í Garðabæ. Raka- og mygluskemmdir komu í ljós eftir afhendingu.', 'NORMAL', 'OPEN'),
        ('22222222-2222-2222-2222-222222222222', 'M-1940/2026', 'Vinnuréttardeila og uppsögn', 'Krafa um bótagreiðslur og vangoldin laun vegna ólögmætrar riftunar ráðningarsamnings sérfræðings.', 'HIGH', 'OPEN'),
        ('33333333-3333-3333-3333-333333333333', 'M-8312/2026', 'Samningsbrot í verktakagreiðslum', 'Krafa aðalverktaka um greiðslu viðbótarverka við byggingu atvinnuhúsnæðis á höfuðborgarsvæðinu.', 'NORMAL', 'OPEN')
    ON CONFLICT (case_number) DO NOTHING;

    INSERT INTO documents (id, case_id, title, doc_type, status, page_count)
    VALUES 
        ('aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa', '11111111-1111-1111-1111-111111111111', 'Kaupsamningur_og_afsöl.pdf', 'Málsskjal', 'READY', 12),
        ('bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb', '11111111-1111-1111-1111-111111111111', 'Matsskýrsla_verkfræðings_byggingargallar.pdf', 'Málsskjal', 'READY', 24),
        ('cccccccc-cccc-cccc-cccc-cccccccccccc', '22222222-2222-2222-2222-222222222222', 'Ráðningarsamningur_2023.pdf', 'Málsskjal', 'READY', 5)
    ON CONFLICT DO NOTHING;
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data-pvc
  namespace: ilcms
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ilcms
  labels:
    app: postgres
    app.kubernetes.io/component: database
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: ilcms_db
            - name: POSTGRES_USER
              value: ilcms_user
            - name: POSTGRES_PASSWORD
              value: ilcms_secret_password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "3Gi"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - ilcms_user
                - -d
                - ilcms_db
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data-pvc
        - name: init-sql
          configMap:
            name: postgres-init-sql
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ilcms
  labels:
    app: postgres
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    app: postgres
