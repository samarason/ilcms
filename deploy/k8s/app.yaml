apiVersion: apps/v1
kind: Deployment
metadata:
  name: ilcms-web
  namespace: ilcms
  labels:
    app: ilcms-web
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ilcms-web
  template:
    metadata:
      labels:
        app: ilcms-web
    spec:
      containers:
        - name: web
          image: ilcms-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: DATABASE_URL
              value: postgresql://ilcms_user:ilcms_secret_password@postgres:5432/ilcms_db
            - name: OLLAMA_BASE_URL
              value: http://ollama:11434
            - name: OLLAMA_MODEL
              value: "gemma2:9b-instruct-q4_K_M"
            - name: OLLAMA_EMBED_MODEL
              value: "nomic-embed-text"
            - name: KEYCLOAK_URL
              value: "http://keycloak:8080"
            - name: KEYCLOAK_REALM
              value: "ilcms"
            - name: KEYCLOAK_CLIENT_ID
              value: "ilcms-web"
            - name: AIRGAP_MODE
              value: "true"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /api/v1/healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/healthz
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: ilcms-web
  namespace: ilcms
  labels:
    app: ilcms-web
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: ilcms-web
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ilcms-ingress
  namespace: ilcms
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: ilcms.local
      http:
        paths:
          - path: /realms
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
          - path: /resources
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ilcms-web
                port:
                  number: 3000
    - host: auth.ilcms.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
