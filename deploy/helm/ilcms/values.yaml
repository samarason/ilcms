# Default values for ILCMS Air-Gapped Deployment
global:
  environment: airgap-poc
  domain: ilcms.local

app:
  replicaCount: 1
  image:
    repository: ilcms-web
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 3000
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2
      memory: 2Gi
  env:
    airgapMode: true
    ollamaModel: "gemma2:9b-instruct-q4_K_M"
    ollamaEmbedModel: "nomic-embed-text"
    keycloakUrl: "http://keycloak:8080"
    keycloakRealm: "ilcms"
    keycloakClientId: "ilcms-web"

keycloak:
  enabled: true
  image:
    repository: quay.io/keycloak/keycloak
    tag: 24.0.5
    pullPolicy: IfNotPresent
  auth:
    adminUser: admin
    adminPassword: admin_secret_ilcms
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 1Gi

ollama:
  enabled: true
  image:
    repository: ollama/ollama
    tag: 0.5.7
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "2"
      memory: "4Gi"
    limits:
      cpu: "6"
      memory: "10Gi"
  persistence:
    enabled: true
    size: 50Gi
    accessMode: ReadWriteOnce
  config:
    numParallel: 1
    maxLoadedModels: 1
    keepAlive: 24h

postgres:
  enabled: true
  image:
    repository: pgvector/pgvector
    tag: pg16
    pullPolicy: IfNotPresent
  auth:
    database: ilcms_db
    username: ilcms_user
    password: ilcms_secret_password
  persistence:
    enabled: true
    size: 20Gi
    accessMode: ReadWriteOnce
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2
      memory: 3Gi

ingress:
  enabled: true
  host: ilcms.local
