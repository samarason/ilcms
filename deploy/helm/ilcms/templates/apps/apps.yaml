apiVersion: apps/v1
kind: Deployment
metadata:
  name: ilcms-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: {{ .Values.images.api }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: ilcms-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: ilcms-api
spec:
  ports:
    - port: 8000
  selector:
    app: api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ilcms-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: {{ .Values.images.worker }}
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: ilcms-secrets
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ilcms-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: {{ .Values.images.frontend }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_KEYCLOAK_URL
              value: "http://auth.{{ .Values.global.domain }}"
---
apiVersion: v1
kind: Service
metadata:
  name: ilcms-frontend
spec:
  ports:
    - port: 3000
  selector:
    app: frontend
